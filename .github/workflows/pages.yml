name: Test and publish satire site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Keep an active main deployment alive until deploy-pages observes completion.
# PR checks may cancel predecessors; main runs may replace pending runs only.
concurrency:
  group: pages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Engine / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test pure JS engine
        run: node --test tests/*.test.cjs
      - name: Syntax check
        run: |
          node --check engine.js
          node --check app.js
      - name: Assert required static files
        run: node -e "for (const p of ['index.html','styles.css','advisories/dread-9999.yaml','assets/zero-day-dread.png']) if (!require('node:fs').statSync(p).size) throw Error(p)"

  yaml:
    name: YAML 1.2 round trips
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruamel.yaml==0.18.16
      - run: python scripts/check-yaml.py

  browser:
    name: Offline browser / ${{ matrix.browser }}
    # Playwright 1.51.1 has a tested Ubuntu 24.04 dependency profile.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated development-only browser harness
        run: |
          npm install --prefix "$RUNNER_TEMP/dread-browser" --no-audit --no-fund playwright@1.51.1
          node "$RUNNER_TEMP/dread-browser/node_modules/playwright/cli.js" install --with-deps "${{ matrix.browser }}"
      - name: Exercise offline UI and download contracts
        env:
          BROWSER: ${{ matrix.browser }}
        run: NODE_PATH="$RUNNER_TEMP/dread-browser/node_modules" node scripts/browser-check.cjs

  build:
    name: Assemble static Pages site
    needs: [test, yaml, browser]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build static site (no packages)
        run: node scripts/stage-site.cjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Confirm this run still targets the latest main commit
        id: freshness
        shell: bash
        run: |
          current="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ ! "$current" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Cannot establish current main identity"
            exit 1
          fi
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping superseded Pages artifact"
          fi
      - uses: actions/deploy-pages@v4
        if: steps.freshness.outputs.fresh == 'true'
        id: deployment
